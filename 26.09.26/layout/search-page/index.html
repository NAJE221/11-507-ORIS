    <!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <link rel="stylesheet" href="styles.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        </head>

        <body>

            <div class="page-container">
                <header class="header-main">

                    <div id="header-info-weather">
                        36°
                    </div>
                    <div id="header-info-city">
                        Ahmedabad
                    </div>

                </header>

                <main class="main-blocks">

                    <div class="main-head">
                        <div id="main-info-time">
                            09:11:01
                        </div>

                        <div id="main-hello">
                            Good Morning, Saad.
                        </div>
                    </div>

                    <div class="main-botton">

                        <div id="main-botton-search">

                            <div id="main-botton-search-icon-div">
                                <svg>
                                    <use href="icons/search.svg#icon-search"></use>
                                </svg>
                            </div>

                            <input
                                id="input-search"
                                type="text"
                                placeholder="Search">
                        </div>

                        <div class="main-botton-pinnedbottom">

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="YouTube">
                                <svg class="icons-svg">
                                    <use href="icons/youtube.svg#icon-youtube"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="ChatGPT">
                                <svg class="icons-svg">
                                    <use href="icons/chatgpt.svg#icon-chatgpt"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="GeeksforGeeks">
                                <svg class="icons-svg">
                                    <use href="icons/geeksforgeeks.svg#icon-geeksforgeeks"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="DeepSeek">
                                <svg class="icons-svg">
                            z        <use href="icons/deepseek.svg#icon-deepseek"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="GitHub">
                                <svg class="icons-svg">
                                    <use href="icons/github.svg#icon-github"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="LinkedIn">
                                <svg class="icons-svg">
                                    <use href="icons/linkedin.svg#icon-linkedin"></use>
                                </svg>
                            </button>

                            <button type = "button" class="dashboard-pinnedbottom" aria-label="Plus">
                                <svg class="icons-svg">
                                    <use href="icons/plus.svg#icon-plus"></use>
                                </svg>
                            </button>
                        </div>
                    </div>
                </main>
            </div>
        </body>
    </html>
